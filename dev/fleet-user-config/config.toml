worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

# Per-project [merge] overrides. wt 0.38 accepts [merge] only in user config,
# so project-specific policy lands here scoped by project identifier. See
# BRW-9IWP94 (pwm-os migration) and BRW-<follow-up> (allow [merge] in project
# config itself) in the WT brainwrap project.

# pwm-os — built-in remote reconciliation during merge, replacing the former
# project-level push + pr pre-merge hooks. `remote-squash` delegates divergence
# handling to GitHub (no force-push; main gets one clean squash commit).
[projects."github.com/Grokr-Labs/pwm-os".merge]
push_to_origin = true
on_diverged_remote = "remote-squash"
auto_open_pr_if_missing = true

# worktrunk fork — same v0.38 reconciliation path. Agent sessions already get
# this via WT_HOOK_CONTEXT auto-detection; the explicit block ensures human
# sessions on the worktrunk repo also use update-ref-based main sync instead
# of the removed legacy [post-merge].sync (BRW-9HNIR4).
[projects."github.com/Grokr-Labs/worktrunk".merge]
push_to_origin = true
on_diverged_remote = "remote-squash"
auto_open_pr_if_missing = true

# pwm-os gate integrity (BRW-VDG27R). Copied verbatim from pwm-os
# scripts/pre-merge-gate-integrity.user-hook.toml at main 9d32e697; that file's
# header documents the design, genesis-signed approvals, and the lost-key
# recovery. User hooks run before a project's own hooks and no pwm-os branch can
# edit this file, so a branch cannot disable the gates that judge it.
[projects."github.com/Grokr-Labs/pwm-os".pre-commit]
gate-integrity = '''r={{ remote }}; t={{ target | default(default_branch) }}; git fetch -q --no-tags "$r" "+refs/heads/$t:refs/remotes/$r/$t" || { echo "[gate-integrity] cannot fetch $r/$t; refusing" >&2; exit 1; }; src=$(git show "refs/remotes/$r/$t:scripts/check-pre-merge-gates.py") || { echo "[gate-integrity] checker missing on $r/$t; refusing" >&2; exit 1; }; python3 -I -c "$src" --remote "$r" --target "$t" --branch {{ branch }} --stage pre-commit --approvals "$HOME/.config/worktrunk/pre-merge-gate-approvals.toml"'''

[projects."github.com/Grokr-Labs/pwm-os".pre-merge]
gate-integrity = '''r={{ remote }}; t={{ target }}; git fetch -q --no-tags "$r" "+refs/heads/$t:refs/remotes/$r/$t" || { echo "[gate-integrity] cannot fetch $r/$t; refusing" >&2; exit 1; }; src=$(git show "refs/remotes/$r/$t:scripts/check-pre-merge-gates.py") || { echo "[gate-integrity] checker missing on $r/$t; refusing" >&2; exit 1; }; python3 -I -c "$src" --remote "$r" --target "$t" --branch {{ branch }} --approvals "$HOME/.config/worktrunk/pre-merge-gate-approvals.toml"'''
